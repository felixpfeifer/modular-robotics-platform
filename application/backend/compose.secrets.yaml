# Production-only overlay. Keep MRP_SETTINGS_KEY_FILE outside this repository,
# with mode 0400, and never bake it into an image or application data volume.
services:
  app:
    environment:
      MRP_SETTINGS_KEY_FILE: /run/secrets/mrp_settings_key
    secrets: [mrp_settings_key]

secrets:
  mrp_settings_key:
    file: ${MRP_SETTINGS_KEY_FILE:?Set this to a 32-byte URL-safe Fernet key file}
