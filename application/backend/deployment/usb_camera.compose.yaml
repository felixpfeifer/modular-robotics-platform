# Overlay: external USB camera (OpenCV/V4L2) instead of the synthetic one.
# The agent sets CAMERA_DEVICE after verifying it is a real capture device that
# is not the laptop's integrated camera.
services:
  camera:
    image: ${MRP_CAMERA_IMAGE:-mrp-camera-opencv}
    entrypoint: null
    build: ../../../../driver/camera_opencv
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
    devices:
      - ${CAMERA_DEVICE:-/dev/null}:${CAMERA_DEVICE:-/dev/null}
    command:
      - --ros-args
      - -p
      - video_device:=${CAMERA_DEVICE:-/dev/null}
      - -p
      - image_width:=${CAMERA_WIDTH:-640}
      - -p
      - image_height:=${CAMERA_HEIGHT:-480}
      - -p
      - fps:=${CAMERA_FPS:-30}
      - -r
      - image/compressed:=${CAMERA_TOPIC:-/webcam/image/compressed}
