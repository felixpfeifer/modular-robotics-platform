# Base cell for the mock-so101 preset (and the hardware presets that reuse it): the existing
# driver/recorder/arbiter images wired to one Zenoh router, with simulated arms and a synthetic
# camera. cell.compose.yaml and the real-device overlays are applied on top of this file.
# Everything here is generated at run time by the deployment agent; there is no per-site config.
x-ros: &ros
  RMW: zenoh
  ROS_DOMAIN_ID: ${MOCK_ROS_DOMAIN_ID:-42}
  ZENOH_CONFIG_OVERRIDE: 'mode="client";connect/endpoints=["tcp/zenoh_router:${MOCK_ZENOH_PORT:-17447}"];scouting/multicast/enabled=false'

x-cell: &cell
  restart: "no"  # an arm must never power back on by itself
  networks: [mock_cell]
  depends_on:
    zenoh_router:
      condition: service_started

# Local driver sources over the image's copy; the image's colcon --symlink-install resolves
# Python, launch and config files from here. C++ changes still need an image rebuild.
x-arm-src: &arm-src
  - ../../../../driver/robot_so101/src:/app/src:ro
  - ../../../../driver/robot_so101/docker:/app/docker:ro

# The arbiter image is not built with --symlink-install, so mount over the installed copy.
x-arbiter-src: &arbiter-src
  - ../../../../core/control_arbiter/control_arbiter:/ws/install/control_arbiter/lib/python3.12/site-packages/control_arbiter:ro
  - ../../../../core/control_arbiter/launch:/ws/install/control_arbiter/share/control_arbiter/launch:ro
  - ../../../../core/control_arbiter/config:/ws/install/control_arbiter/share/control_arbiter/config:ro
  - ../../../../core/control_arbiter/docker:/ws/control_arbiter/docker:ro

services:
  zenoh_router:
    image: mrp-robot-so101
    command: ["zenoh-router"]
    restart: "no"
    networks: [mock_cell]
    volumes: *arm-src
    ports:
      - "${MOCK_ZENOH_BIND:-127.0.0.1}:${MOCK_ZENOH_PORT:-17447}:${MOCK_ZENOH_PORT:-17447}"
    environment:
      RMW: zenoh
      ROS_DOMAIN_ID: ${MOCK_ROS_DOMAIN_ID:-42}
      ZENOH_CONFIG_OVERRIDE: 'listen/endpoints=["tcp/0.0.0.0:${MOCK_ZENOH_PORT:-17447}"]'

  leader:
    <<: *cell
    image: ${MRP_LEADER_IMAGE:-mrp-robot-so101}
    command: ["arm"]
    environment:
      <<: *ros
      ROLE: leader
      NAMESPACE: leader
      BACKEND: mock
    volumes: *arm-src

  follower:
    <<: *cell
    image: ${MRP_FOLLOWER_IMAGE:-mrp-robot-so101}
    command: ["arm"]
    environment:
      <<: *ros
      ROLE: follower
      NAMESPACE: ""
      BACKEND: mock
    volumes: *arm-src

  # Moves the simulated leader so mock recordings contain real joint data (profile "motion").
  leader_motion:
    <<: *cell
    image: mrp-robot-so101
    profiles: [motion]
    entrypoint: ["/bin/bash", "-c", "source /opt/platform/install/setup.bash && cd /opt/mock && exec python3 mock_motion.py"]
    environment:
      <<: *ros
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      MOCK_MOTION_SEED: ${MOCK_MOTION_SEED:-0}
      MOCK_MOTION_SPEED: ${MOCK_MOTION_SPEED:-1.0}
      MOCK_MOTION_MODE: ${MOCK_MOTION_MODE:-waypoints}
    volumes:
      - ./mock_motion.py:/opt/mock/mock_motion.py:ro
      - ./motion_planner.py:/opt/mock/motion_planner.py:ro

  control:
    <<: *cell
    image: mrp-control-arbiter
    environment:
      <<: *ros
    volumes: *arbiter-src
    healthcheck:
      # Not docker/healthcheck.sh: its `set -u` trips over the ROS setup script's COLCON_TRACE.
      test: ["CMD", "/bin/bash", "-c", "source /opt/platform/install/setup.bash && source /ws/install/setup.bash && ros2 node list | grep -Fxq /control_arbiter"]
      interval: 5s
      timeout: 3s
      retries: 5

  camera:
    <<: *cell
    image: ${MRP_CAMERA_IMAGE:-mrp-episode-recorder}
    entrypoint: ["/bin/bash", "-c", "source /opt/platform/install/setup.bash && exec python3 /opt/mock/mock_camera.py"]
    environment:
      <<: *ros
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      CAMERA_TOPIC: ${CAMERA_TOPIC:-/webcam/image/compressed}
      CAMERA_NODE: mock_webcam
      CAMERA_WIDTH: ${CAMERA_WIDTH:-640}
      CAMERA_HEIGHT: ${CAMERA_HEIGHT:-480}
      CAMERA_FPS: ${CAMERA_FPS:-30}
    volumes:
      - ./mock_camera.py:/opt/mock/mock_camera.py:ro
    healthcheck: {disable: true}

  camera2:
    <<: *cell
    image: ${MRP_CAMERA2_IMAGE:-mrp-episode-recorder}
    profiles: [side]
    entrypoint: ["/bin/bash", "-c", "source /opt/platform/install/setup.bash && exec python3 /opt/mock/mock_camera.py"]
    environment:
      <<: *ros
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      CAMERA_TOPIC: ${CAMERA2_TOPIC:-/side/image/compressed}
      CAMERA_NODE: mock_side
      CAMERA_LABEL: Simulated side camera
      CAMERA_WIDTH: ${CAMERA2_WIDTH:-640}
      CAMERA_HEIGHT: ${CAMERA2_HEIGHT:-480}
      CAMERA_FPS: ${CAMERA2_FPS:-30}
    volumes:
      - ./mock_camera.py:/opt/mock/mock_camera.py:ro
    healthcheck: {disable: true}

  # Standalone command bridge: joint intents from the arbiter become follower commands.
  bridge:
    <<: *cell
    image: mrp-episode-recorder
    command:
      - ros2
      - run
      - episode_recorder
      - joint_intent_bridge.py
      - --ros-args
      - -p
      - robot_config:=/workspace/core/recorder/config/robots/so101_sim.yaml
    environment:
      <<: *ros
    volumes:
      - ../../../../core/recorder/config:/workspace/core/recorder/config:ro

  recorder:
    <<: *cell
    image: mrp-episode-recorder
    command: ["workspace_config:=/workspace/config/mock-so101/workspace.yaml"]
    stdin_open: true
    tty: true
    environment:
      <<: *ros
    volumes:
      - recordings:/data/datasets
      - ../../../../core/recorder/config:/workspace/core/recorder/config:ro

volumes:
  recordings:
    name: mrp-mock-so101_recordings

networks:
  mock_cell:
    name: mrp-cell
