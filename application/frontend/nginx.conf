map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  proxy_set_header Host $http_host;
  location / { try_files $uri $uri/ /index.html; }
  # Starting a cell may include first-time downloads of large ROS images.
  location /api/ {
    proxy_http_version 1.1;
    # Any proxy_set_header here drops the server-level ones, so repeat Host.
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 7305s;
    proxy_pass http://backend:8088;
  }
  location = /docs { proxy_pass http://backend:8088; }
  location = /redoc { proxy_pass http://backend:8088; }
  location = /health { proxy_pass http://backend:8088; }
  location = /openapi.json { proxy_pass http://backend:8088; }
}
