default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.1
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]
  - repo: local
    hooks:
      - id: contract-validation
        name: validate ROS interface repository
        entry: python3 tools/check_contract_catalog.py
        language: system
        pass_filenames: false
