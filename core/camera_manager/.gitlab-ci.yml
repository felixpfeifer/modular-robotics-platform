include:
  - local: .gitlab/ci/docker-hub.yml

stages:
  - image-check
  - lint
  - test
  - source_security
  - image-build
  - image_security
  - image-publish

variables:
  # Base images this repo is FROM; a scheduled pipeline rebuilds when one changes (docker-hub.yml).
  IMAGE_BASES: |
    mrp-camera-manager all docker.io/${DOCKERHUB_USERNAME}/mrp-ros-base:latest
  DEBIAN_FRONTEND: noninteractive
  GIT_DEPTH: "1"
  TRIVY_VERSION: "0.56.2"
  HADOLINT_VERSION: "2.12.0"
  CAMERA_IMAGE: mrp-camera-manager

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Every job below is independent (needs: []), so none waits for the previous stage.
.ros_job:
  image: ros:jazzy-ros-base
  needs: []

lint:
  extends: .ros_job
  stage: lint
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends build-essential cmake cppcheck
      clang-format clang-tidy libopencv-dev yamllint
  script:
    - >-
      test -z "$(find include src test -type f \( -name '*.hpp' -o -name '*.cpp' \)
      -print0 | xargs -0 clang-format --dry-run --Werror)"
    - yamllint -c .yamllint.yml .gitlab-ci.yml config launch
    - source /opt/ros/jazzy/setup.bash
    - cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - cmake --build build-ci --target lint
    - clang-tidy -p build-ci src/*.cpp test/*.cpp --warnings-as-errors='*'

.cpp_test:
  extends: .ros_job
  stage: test
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential cmake libopencv-dev

unit_test:
  extends: .cpp_test
  script:
    - cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
    - cmake --build build-ci --parallel
    - ctest --test-dir build-ci --output-on-failure --output-junit "$CI_PROJECT_DIR/build-ci/test-results.xml"
  artifacts:
    when: always
    reports:
      junit: build-ci/test-results.xml
    paths:
      - build-ci/Testing/
      - build-ci/test-results.xml
    expire_in: 1 week

sanitizers:
  extends: .cpp_test
  script:
    - >-
      cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
    - cmake --build build-sanitizers --parallel
    - ctest --test-dir build-sanitizers --output-on-failure

# Secrets are already scanned by secret_detection and image:context (docker-hub.yml),
# so this only looks for vulnerabilities and misconfiguration.
source_security:
  stage: source_security
  needs: []
  image:
    name: aquasec/trivy:${TRIVY_VERSION}
    entrypoint: [""]
  script:
    - >-
      trivy fs --skip-check-update --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1
      --format json --output trivy-source.json .
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - trivy-source.json
  # Fails with a warning if vulnerabilities are found. Because i cant fix them
  allow_failure: true

dockerfile_security:
  stage: source_security
  needs: []
  image:
    name: hadolint/hadolint:${HADOLINT_VERSION}-debian
    entrypoint: [""]
  script:
    - hadolint --failure-threshold error Dockerfile

build:mrp-camera-manager:amd64:
  extends: [.image-build, .image-amd64]
  variables: &camera_manager_image
    IMAGE_NAME: mrp-camera-manager
    IMAGE_BUILD_ARGS: BASE_IMAGE=docker.io/${DOCKERHUB_USERNAME}/mrp-ros-base:latest

build:mrp-camera-manager:arm64:
  extends: [.image-build, .image-arm64]
  variables: *camera_manager_image

# Scan the natively built arm64 image that build:*:arm64 staged in the GitLab registry.
# It only exists on protected refs, which are also the only refs that publish.
image_security:
  extends: .mrp-publish-gate
  stage: image_security
  image:
    name: aquasec/trivy:${TRIVY_VERSION}
    entrypoint: [""]
  needs:
    - job: build:mrp-camera-manager:arm64
      artifacts: false
  variables:
    GIT_STRATEGY: none
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - export IMAGE="${CI_REGISTRY_IMAGE}/${CAMERA_IMAGE}:ci-${CI_PIPELINE_ID}-arm64"
    - set +e
    - >-
      trivy image "$IMAGE" --severity HIGH,CRITICAL --exit-code 1
      --format json --output "$CI_PROJECT_DIR/trivy-image.json"
    - scan_status=$?
    - trivy image "$IMAGE" --format cyclonedx --output "$CI_PROJECT_DIR/image-sbom.cdx.json"
    - sbom_status=$?
    - test "$scan_status" -eq 0 -a "$sbom_status" -eq 0
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - trivy-image.json
      - image-sbom.cdx.json

publish:mrp-camera-manager:
  extends: .image-publish
  variables: *camera_manager_image
  needs:
    - job: base:check
      optional: true
      artifacts: true
    - job: lint
      artifacts: false
    - job: unit_test
      artifacts: false
    - job: sanitizers
      artifacts: false
    - job: source_security
      artifacts: false
    - job: dockerfile_security
      artifacts: false
    - job: image_security
      artifacts: false
    - job: build:mrp-camera-manager:amd64
      artifacts: false
    - job: build:mrp-camera-manager:arm64
      artifacts: false
