include:
  - local: .gitlab/ci/docker-hub.yml

variables:
  IMAGE_BASES: |
    mrp-ai-lerobot amd64 docker.io/${DOCKERHUB_USERNAME}/mrp-ros-base-cuda:latest
    mrp-ai-lerobot arm64 docker.io/${DOCKERHUB_USERNAME}/mrp-ros-base-jetson:latest

stages:
  - image-check
  - test
  - image-build
  - image-publish

unit:
  stage: test
  image: python:3.12-slim
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_HTTP_TIMEOUT: "300"
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache/]
  script:
    - pip install --disable-pip-version-check uv==0.8.13
    - uv sync --frozen
    - uv run --frozen python -m pytest -q tests --junitxml=reports/pytest.xml
  artifacts:
    when: always
    reports:
      junit: reports/pytest.xml

# amd64 uses the CUDA base, arm64 the Jetson Orin base (JetPack 7.2 / CUDA 13). Both carry the platform
# ROS messages; PyTorch comes from the matching CUDA wheel index. Override the arch build args with a CI
# variable of the same name if the Jetson wheel index needs to change.
build:mrp-ai-lerobot:amd64:
  extends: [.image-build, .image-amd64]
  variables: &ai_lerobot_image
    IMAGE_NAME: mrp-ai-lerobot
    IMAGE_BUILD_ARGS_amd64: >-
      BASE_IMAGE=docker.io/${DOCKERHUB_USERNAME}/mrp-ros-base-cuda:latest
      TORCH_INDEX_URL=https://download.pytorch.org/whl/cu128
    IMAGE_BUILD_ARGS_arm64: >-
      BASE_IMAGE=docker.io/${DOCKERHUB_USERNAME}/mrp-ros-base-jetson:latest
      TORCH_INDEX_URL=https://download.pytorch.org/whl/cu130

build:mrp-ai-lerobot:arm64:
  extends: [.image-build, .image-arm64]
  variables: *ai_lerobot_image

publish:mrp-ai-lerobot:
  extends: .image-publish
  variables: *ai_lerobot_image
  needs:
    - job: base:check
      optional: true
      artifacts: true
    - job: unit
      artifacts: false
    - job: build:mrp-ai-lerobot:amd64
      artifacts: false
    - job: build:mrp-ai-lerobot:arm64
      artifacts: false
