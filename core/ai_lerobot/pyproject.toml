[project]
name = "mrp-ai-lerobot"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[dataset,training,smolvla,groot]==0.6.1",
  "torch==2.11.0",
  "torchvision==0.26.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
  "pytest==9.0.2",
]
